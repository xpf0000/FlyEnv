name: Build FlyEnv macOS Packages
on:
  push:
    paths:
      - 'build/macos.build.yml' # 触发路径参考 Linux 配置

jobs:
  build-macos:
    name: Build (${{ matrix.arch }})
    # 使用 strategy matrix 实现分架构并行构建
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - arch: x64
            os: macos-15-intel # Intel 运行环境
            target: x64
          - arch: arm64
            os: macos-latest # Apple Silicon 运行环境
            target: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'src/helper-go/go.mod'
          cache-dependency-path: 'src/helper-go/go.sum'

      - name: Cache node_modules and node-gyp
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            **/node_modules
            .yarn/cache
            ~/.cache/node-gyp
          key: ${{ runner.os }}-${{ matrix.arch }}-node-${{ hashFiles('**/package.json') }}

      - name: Install Yarn and build tools
        run: |
          npm install -g yarn node-gyp

      - name: Prepare Notarization API Key
        env:
          AUTH_KEY_BASE64: ${{ secrets.MACOS_AUTH_KEY_BASE64 }}
        run: |
          mkdir -p build
          echo -n "$AUTH_KEY_BASE64" | base64 --decode -o build/apple_api_key.p8

      - name: Install dependencies
        run: yarn install

      - name: Build Go helper
        run: |
          cd "$GITHUB_WORKSPACE/src/helper-go"
          chmod +x ./build.sh
          bash ./build.sh # 脚本会根据当前 matrix 架构自动构建

      - name: Build and Notarize Electron App
        env:
          # 关键点：增加 Node 内存上限到 8GB
          NODE_OPTIONS: '--max-old-space-size=4096'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          # 核心修复：electron-builder 寻找的是 APPLE_API_KEY
          APPLE_API_KEY: ${{ github.workspace }}/build/apple_api_key.p8
          APPLE_API_KEY_PATH: ${{ github.workspace }}/build/apple_api_key.p8
        run: yarn build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FlyEnv-macOS-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.yml
            release/*.blockmap
